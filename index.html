<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iwithfuture SEO 增长工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <aside class="input-panel" aria-label="输入设置">
          <div class="brand-row">
            <div class="logo-mark" aria-hidden="true">iF</div>
            <div>
              <p class="eyebrow">iwithfuture Workspace</p>
              <h1>SEO 增长工作台</h1>
            </div>
          </div>
          <a class="site-link" href="https://iwithfuture.com/" target="_blank" rel="noopener noreferrer">返回 iwithfuture 主站</a>

          <form id="plannerForm" class="form-stack">
            <label class="field">
              <span>核心词</span>
              <input id="keyword" name="keyword" type="text" value="外链" placeholder="例如：外链、阿里国际站、Shopify SEO" required />
            </label>

            <div class="field-grid">
              <label class="field">
                <span>目标市场</span>
                <select id="market" name="market">
                  <option>中文市场</option>
                  <option>英文市场</option>
                  <option>全球市场</option>
                </select>
              </label>

              <label class="field">
                <span>网站阶段</span>
                <select id="stage" name="stage">
                  <option>新站</option>
                  <option>已有内容</option>
                  <option>已有流量</option>
                  <option>已有客户案例</option>
                </select>
              </label>
            </div>

            <label class="field">
              <span>目标用户</span>
              <input id="audience" name="audience" type="text" value="B2B 企业和外贸企业" placeholder="例如：外贸老板、SEO 从业者、SaaS 创始人" />
            </label>

            <div class="field-grid">
              <label class="field">
                <span>业务类型</span>
                <select id="businessType" name="businessType">
                  <option>服务</option>
                  <option>咨询</option>
                  <option>课程</option>
                  <option>工具站</option>
                  <option>内容站</option>
                  <option>SaaS</option>
                  <option>电商</option>
                </select>
              </label>

              <label class="field">
                <span>变现方式</span>
                <select id="monetization" name="monetization">
                  <option>询盘</option>
                  <option>咨询</option>
                  <option>注册</option>
                  <option>购买</option>
                  <option>资料下载</option>
                  <option>广告</option>
                </select>
              </label>
            </div>

            <label class="field">
              <span>内容深度</span>
              <div class="segmented" role="radiogroup" aria-label="内容深度">
                <label>
                  <input type="radio" name="depth" value="简版" />
                  <span>简版</span>
                </label>
                <label>
                  <input type="radio" name="depth" value="标准版" checked />
                  <span>标准版</span>
                </label>
                <label>
                  <input type="radio" name="depth" value="深度版" />
                  <span>深度版</span>
                </label>
              </div>
            </label>

            <details class="advanced-panel">
              <summary>高级设置</summary>
              <div class="advanced-grid">
                <label class="field">
                  <span>品牌名</span>
                  <input id="brandName" name="brandName" type="text" placeholder="例如：未来增长实验室" />
                </label>
                <label class="field">
                  <span>网站 URL</span>
                  <input id="websiteUrl" name="websiteUrl" type="url" placeholder="https://example.com" />
                </label>
                <label class="field">
                  <span>作者/专家</span>
                  <input id="authorName" name="authorName" type="text" placeholder="例如：David，SEO 顾问" />
                </label>
                <label class="field">
                  <span>核心 CTA</span>
                  <input id="coreOffer" name="coreOffer" type="text" placeholder="例如：免费 SEO 诊断" />
                </label>
                <label class="field">
                  <span>服务地区</span>
                  <input id="region" name="region" type="text" placeholder="例如：中国 / 美国 / 全球" />
                </label>
                <label class="field">
                  <span>案例/优势</span>
                  <input id="proofPoints" name="proofPoints" type="text" placeholder="例如：10 年经验、50+ 案例、B2B 行业" />
                </label>
                <label class="field">
                  <span>月搜索量</span>
                  <input id="searchVolume" name="searchVolume" type="number" min="0" placeholder="可选，后续可接 API" />
                </label>
                <label class="field">
                  <span>竞争度 0-100</span>
                  <input id="difficulty" name="difficulty" type="number" min="0" max="100" placeholder="可选" />
                </label>
                <label class="field">
                  <span>CPC</span>
                  <input id="cpc" name="cpc" type="number" min="0" step="0.01" placeholder="可选" />
                </label>
              </div>
            </details>

            <button class="primary-action" type="submit">生成增长方案</button>
          </form>

          <div class="side-note">
            <strong>工作模块</strong>
            <div class="mini-tags" aria-label="策略模块">
              <span>Hub</span>
              <span>Spoke</span>
              <span>AEO</span>
              <span>GEO</span>
              <span>Schema</span>
            </div>
          </div>
        </aside>

        <section class="output-panel" aria-live="polite">
          <div class="output-toolbar">
            <div>
              <p class="eyebrow">Project Workspace</p>
              <h2 id="resultTitle">外链 增长方案</h2>
              <div class="result-meta" aria-label="结果模块">
                <span>关键词策略</span>
                <span>内容生产</span>
                <span>站点运营</span>
                <span>客户交付</span>
              </div>
            </div>
            <div class="toolbar-actions">
              <button id="copyMarkdown" class="ghost-button" type="button">复制 Markdown</button>
              <button id="downloadCsv" class="ghost-button" type="button">下载 CSV</button>
            </div>
          </div>

          <nav class="tabs" aria-label="结果分类">
            <div class="tab-group">
              <span>策略</span>
              <button class="tab is-active" data-tab="hubs" type="button">Hub</button>
              <button class="tab" data-tab="spokes" type="button">Spoke</button>
              <button class="tab" data-tab="priority" type="button">优先内容</button>
              <button class="tab" data-tab="serp" type="button">SERP</button>
              <button class="tab" data-tab="expansion" type="button">关键词扩展</button>
              <button class="tab" data-tab="dataIntent" type="button">数据/意图</button>
            </div>
            <div class="tab-group">
              <span>生产</span>
              <button class="tab" data-tab="brief" type="button">页面结构</button>
              <button class="tab" data-tab="article" type="button">文章初稿</button>
              <button class="tab" data-tab="aeo" type="button">AEO/GEO</button>
              <button class="tab" data-tab="eeat" type="button">E-E-A-T</button>
              <button class="tab" data-tab="schema" type="button">Schema</button>
            </div>
            <div class="tab-group">
              <span>运营</span>
              <button class="tab" data-tab="links" type="button">内链</button>
              <button class="tab" data-tab="contentCalendar" type="button">内容日历</button>
              <button class="tab" data-tab="calendar" type="button">发布节奏</button>
              <button class="tab" data-tab="assets" type="button">资产库</button>
              <button class="tab" data-tab="score" type="button">评分</button>
              <button class="tab" data-tab="workflow" type="button">工作流</button>
            </div>
            <div class="tab-group">
              <span>交付</span>
              <button class="tab" data-tab="projects" type="button">客户项目</button>
              <button class="tab" data-tab="landing" type="button">落地页</button>
              <button class="tab" data-tab="audit" type="button">SEO审计</button>
              <button class="tab" data-tab="gap" type="button">竞品差距</button>
              <button class="tab" data-tab="report" type="button">客户报告</button>
            </div>
          </nav>

          <div id="tabContent" class="tab-content"></div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
